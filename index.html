    <title>InvestMore</title>
    <!-- Splash screen: plain HTML/CSS (logo embedded) so it starts the instant the app opens. main.tsx fades it out. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(110% 75% at 50% 40%, #ffffff 0%, #f5fbf6 50%, #eaf6ed 100%);
        font-family: Inter, system-ui, -apple-system, sans-serif; transition: opacity .7s cubic-bezier(.4,0,.2,1); }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash .stage { position: relative; display: grid; justify-items: center; }
      /* one soft glow that breathes slowly behind the logo */
      #splash .glow { position: absolute; top: 60px; left: 50%; width: 240px; height: 240px; margin: -120px 0 0 -120px; border-radius: 50%;
        background: radial-gradient(circle, rgba(16,150,60,.16) 0%, rgba(16,150,60,0) 68%);
        animation: sp-breathe 3.2s ease-in-out infinite; }
      #splash .card { position: relative; width: 120px; height: 120px; border-radius: 32px; background: #fff; display: grid; place-items: center; overflow: hidden;
        box-shadow: 0 18px 44px -20px rgba(4,80,30,.45), 0 0 0 1px rgba(4,60,25,.05);
        animation: sp-in 1.1s cubic-bezier(.16,1,.3,1) both; }
      #splash .card img { width: 84%; height: 84%; object-fit: contain; }
      /* a slow, faint light passing across the logo */
      #splash .card::after { content: ''; position: absolute; inset: -50%; transform: translateX(-130%) rotate(20deg);
        background: linear-gradient(90deg, transparent 40%, rgba(255,255,255,.55) 50%, transparent 60%);
        animation: sp-shine 2.2s cubic-bezier(.45,0,.25,1) .5s both; }
      #splash .name { margin-top: 24px; font-weight: 700; font-size: 24px; color: #141414; letter-spacing: .5em; padding-left: .5em;
        animation: sp-name 1.3s cubic-bezier(.16,1,.3,1) .15s both; }
      #splash .name b { color: #0a8f30; font-weight: 700; }
      #splash .tag { margin-top: 9px; font-weight: 500; font-size: 10.5px; letter-spacing: .5em; padding-left: .5em; color: #7a8079;
        animation: sp-fade 1.2s ease .45s both; }
      #splash .line { margin-top: 30px; width: 44px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, rgba(10,143,48,0), #0a8f30, rgba(10,143,48,0));
        animation: sp-line 1.6s ease-in-out .6s infinite both; }
      @keyframes sp-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
      @keyframes sp-name { from { opacity: 0; letter-spacing: .7em; padding-left: .7em; } to { opacity: 1; letter-spacing: .32em; padding-left: .32em; } }
      @keyframes sp-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sp-shine { to { transform: translateX(130%) rotate(20deg); } }
      @keyframes sp-breathe { 0%, 100% { transform: scale(.94); opacity: .75; } 50% { transform: scale(1.06); opacity: 1; } }
      @keyframes sp-line { 0% { opacity: .2; transform: scaleX(.4); } 50% { opacity: 1; transform: scaleX(1.6); } 100% { opacity: .2; transform: scaleX(.4); } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash *::after { animation: none !important; } }
      @media print { #splash { display: none; } }
    </style>
